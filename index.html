<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OSN Mathematics Hub — V1.5</title>
<style>
:root{
  --bg:#0a0e14; --surf:#111826; --surf2:#161f30; --line:#232f45;
  --text:#e7edf6; --muted:#8492a6; --accent:#4fd1c5; --warn:#f0b429; --bad:#f0616d;
  font-size:16px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;}
body{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;background-attachment:fixed;background-position:center;}
h1,h2,h3{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:600;letter-spacing:-.02em;margin:0 0 .5em}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,14,20,.92);backdrop-filter:blur(6px);z-index:10;overflow-x:auto}
.brand{font-family:'JetBrains Mono',monospace;font-weight:700;white-space:nowrap}
.brand span{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:nowrap}
nav button{background:none;border:1px solid transparent;color:var(--muted);padding:7px 10px;border-radius:6px;font-size:.82rem;cursor:pointer;white-space:nowrap;font-family:inherit}
nav button.on{color:var(--text);border-color:var(--line);background:var(--surf)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.btn{background:var(--accent);color:#05201c;border:none;padding:11px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.92rem}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:6px 12px;font-size:.8rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid4{grid-template-columns:1fr}nav{gap:2px}.top{padding:10px 12px}table{display:block;overflow-x:auto;white-space:nowrap}.wrap{padding-left:12px;padding-right:12px}.card{padding:15px}}
.bar{height:10px;background:var(--surf2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--muted);font-size:.88rem}
.pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.72rem;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.node{border:1px solid var(--line);border-left:3px solid var(--muted);background:var(--surf);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.node.MASTERED{border-left-color:var(--accent)}
.node.IN_PROGRESS{border-left-color:var(--warn)}
.node.LOCKED{opacity:.55}
.opt{display:block;width:100%;text-align:left;background:var(--surf2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:7px;margin-bottom:8px;cursor:pointer;font-family:inherit;font-size:.95rem}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--accent);background:#0f2622}
.opt.wrong{border-color:var(--bad);background:#2a1216}
.sec-label{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:.85rem} .learn-step{border-left:2px solid var(--accent);padding-left:12px;margin:12px 0}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
input[type=text]{width:100%;background:var(--surf2);border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:7px;font-family:inherit}
::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* ---------- V1.5 UX ---------- */
.focus-card{border-left:3px solid var(--accent);background:linear-gradient(90deg,rgba(79,209,197,.08),var(--surf))}
.focus-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
.focus-number{font-family:'JetBrains Mono',monospace;font-size:1.45rem;color:var(--accent)}
.path-chain{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 12px}
.path-step{min-width:145px;background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:12px;cursor:pointer}
.path-step:hover{border-color:var(--accent)}
.path-arrow{display:flex;align-items:center;padding:0 7px;color:var(--muted)}
.strategy-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.strategy-item{background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:14px;cursor:pointer}
.strategy-item:hover{border-color:var(--accent)}
.tag{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.72rem;margin:2px 3px 2px 0}
.next-action{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:680px){.focus-grid,.strategy-grid{grid-template-columns:1fr}.path-step{min-width:132px}}

</style>
</head>

<script>
/* ---------- DATA ---------- */
const TOPICS=["numberTheory","algebra","geometry","combinatorics"];
const TOPIC_LABEL={numberTheory:"Number Theory",algebra:"Algebra",geometry:"Geometry",combinatorics:"Combinatorics"};

const CONCEPTS=[
 {id:"bil-bulat",topic:"numberTheory",title:"Bilangan Bulat",order:1,
  learn:"Mulai dari mengenali jenis bilangan dan bagaimana bilangan positif, negatif, dan nol bekerja.",
  intuition:"Bayangkan garis bilangan. Bergerak ke kanan berarti nilainya bertambah, ke kiri berarti berkurang.",
  def:"Bilangan bulat adalah ℤ={...,−2,−1,0,1,2,...}. Bilangan ini tidak memiliki bagian pecahan atau desimal.",
  example:"−7+12=5. Dari −7 bergerak 12 langkah ke kanan sampai 5.",
  pattern:"Perhatikan pola genap dan ganjil. Genap+genap=genap, ganjil+ganjil=genap, dan genap+ganjil=ganjil.",
  mistake:"Menganggap 0 positif atau negatif. Dalam bilangan bulat, 0 bukan positif dan bukan negatif.",
  osn:"Sifat genap-ganjil dan operasi bilangan bulat sering menjadi langkah awal pembuktian OSN.",
  quiz:{q:"Manakah yang BUKAN bilangan bulat?",opts:["−5","0","3,5","100"],ans:2,exp:"3,5 memiliki bagian desimal, sehingga bukan anggota ℤ."}},
 {id:"faktor-kelipatan",topic:"numberTheory",title:"Faktor & Kelipatan",order:2,
  learn:"Pahami hubungan 'membagi' dan 'dikali'. Ini menjadi fondasi FPB, KPK, dan faktorisasi.",
  intuition:"Faktor adalah bilangan yang bisa membagi habis. Kelipatan adalah hasil mengalikan suatu bilangan dengan bilangan bulat.",
  def:"b adalah faktor a jika a=b·k untuk suatu bilangan bulat k.",
  example:"Faktor positif 12 adalah 1,2,3,4,6,12. Kelipatan 4 adalah 4,8,12,16,...",
  pattern:"Jika kamu sudah bisa mencari faktor, kamu akan lebih mudah memahami FPB, KPK, dan banyaknya faktor.",
  mistake:"Mencampur istilah faktor dan kelipatan. Ingat: 3 faktor dari 12, sedangkan 12 kelipatan dari 3.",
  osn:"Banyak soal Number Theory meminta kita mencari atau membatasi faktor suatu bilangan.",
  quiz:{q:"Berapa banyak faktor positif dari 18?",opts:["4","5","6","9"],ans:2,exp:"18 memiliki faktor 1,2,3,6,9,18, jadi ada 6 faktor."}},
 {id:"fpb-kpk",topic:"numberTheory",title:"FPB & KPK",order:3,
  learn:"Sekarang gabungkan konsep faktor dan kelipatan untuk mencari pembagi bersama terbesar dan kelipatan bersama terkecil.",
  intuition:"FPB mencari 'pembagi bersama paling besar'. KPK mencari 'kelipatan bersama paling kecil'.",
  def:"FPB(a,b) adalah bilangan terbesar yang membagi a dan b. KPK(a,b) adalah bilangan positif terkecil yang habis dibagi a dan b.",
  example:"FPB(12,18)=6 dan KPK(12,18)=36.",
  pattern:"Dengan faktorisasi prima, FPB mengambil pangkat terkecil dan KPK mengambil pangkat terbesar dari prima yang relevan.",
  mistake:"Menukar pangkat terkecil dan terbesar saat mencari FPB/KPK.",
  osn:"FPB dan KPK sering muncul dalam soal pembagian, periode berulang, serta persamaan bilangan bulat.",
  quiz:{q:"FPB(24,36)=?",opts:["6","8","12","18"],ans:2,exp:"24=2³·3 dan 36=2²·3². Pangkat terkecil memberi 2²·3=12."}},
 {id:"bil-prima",topic:"numberTheory",title:"Bilangan Prima",order:4,
  learn:"Kenali 'blok penyusun' bilangan bulat sebelum masuk ke faktorisasi prima.",
  intuition:"Bilangan prima seperti blok dasar: faktor positifnya hanya 1 dan dirinya sendiri.",
  def:"Bilangan p>1 disebut prima jika faktor positifnya hanya 1 dan p.",
  example:"2,3,5,7,11,13,... adalah bilangan prima. 2 adalah satu-satunya prima genap.",
  pattern:"Untuk mengecek apakah n prima, cukup mencoba pembagi prima hingga √n.",
  mistake:"Menganggap 1 sebagai prima. 1 hanya punya satu faktor positif.",
  osn:"Sifat bilangan prima menjadi dasar faktorisasi, divisibility, modulo, dan banyak pembuktian.",
  quiz:{q:"Manakah yang merupakan bilangan prima?",opts:["21","27","31","33"],ans:2,exp:"31 hanya memiliki faktor positif 1 dan 31."}},
 {id:"faktorisasi",topic:"numberTheory",title:"Faktorisasi Prima",order:5,
  learn:"Pecah sebuah bilangan menjadi perkalian bilangan prima. Ini adalah alat penting untuk banyak soal Number Theory.",
  intuition:"Anggap faktorisasi prima sebagai 'sidik jari' sebuah bilangan: susunan prima penyusunnya unik.",
  def:"Setiap n>1 dapat ditulis secara unik sebagai hasil kali pangkat bilangan prima.",
  example:"360=2³·3²·5.",
  pattern:"Jika n=p₁^a¹·p₂^a²·..., banyak faktor positif n adalah (a¹+1)(a²+1)...",
  mistake:"Berhenti terlalu cepat saat membagi. Pastikan semua faktor yang tersisa sudah prima.",
  osn:"Faktorisasi menjadi dasar menghitung faktor, FPB/KPK, dan menyusun pembuktian divisibility.",
  quiz:{q:"Faktorisasi prima 84 adalah?",opts:["2²·3·7","2·3²·7","2²·21","4·3·7"],ans:0,exp:"84=4·21=2²·3·7."}},
 {id:"divisibility",topic:"numberTheory",title:"Habis Dibagi (Divisibility)",order:6,
  learn:"Belajar membaca simbol a|b dan menggunakan aturan habis dibagi tanpa menghitung pembagian panjang.",
  intuition:"Daripada membagi angka besar, kita cari ciri yang langsung menunjukkan apakah pembagian akan bersisa 0.",
  def:"a|b berarti ada bilangan bulat k sehingga b=a·k.",
  example:"723 habis dibagi 3 karena 7+2+3=12 dan 12 habis dibagi 3.",
  pattern:"Aturan 3 dan 9 memakai jumlah digit; aturan 4 dan 8 melihat beberapa digit terakhir; aturan 11 memakai selisih jumlah digit berselang.",
  mistake:"Menggunakan aturan divisibility tanpa memastikan aturan itu memang berlaku untuk pembagi yang dimaksud.",
  osn:"Pembuktian bahwa suatu bentuk bilangan selalu habis dibagi k merupakan tipe soal dasar OSN.",
  quiz:{q:"Apakah 2464 habis dibagi 8?",opts:["Ya, karena 464 habis dibagi 8","Tidak","Ya, karena digit terakhir genap","Tidak cukup informasi"],ans:0,exp:"Cukup periksa tiga digit terakhir: 464=8·58."}},
 {id:"modulo",topic:"numberTheory",title:"Modulo",order:7,
  learn:"Mulai melihat bilangan berdasarkan sisanya. Ini adalah pintu masuk ke banyak trik OSN.",
  intuition:"Bayangkan jam. Setelah mencapai angka terakhir, kita kembali ke awal. Modulo bekerja dengan ide siklus seperti itu.",
  def:"a mod n adalah sisa pembagian a oleh n, dengan 0≤a mod n<n untuk n>0.",
  example:"17 mod 5=2 karena 17=3·5+2.",
  pattern:"Kita boleh mereduksi bilangan sebelum menghitung: (a+b) mod n=((a mod n)+(b mod n)) mod n.",
  mistake:"Mencampur simbol 'mod' sebagai operasi sisa dengan '≡' sebagai hubungan kongruensi.",
  osn:"Modulo sangat berguna untuk digit terakhir, pola pangkat, dan soal divisibility.",
  quiz:{q:"(23+19) mod 7=?",opts:["0","2","3","4"],ans:0,exp:"23+19=42 dan 42 mod 7=0."}},
 {id:"kongruensi",topic:"numberTheory",title:"Kongruensi",order:8,
  learn:"Naik satu tingkat dari modulo: kita tidak hanya mencari sisa, tetapi membandingkan dua bilangan berdasarkan modulus yang sama.",
  intuition:"Dua bilangan kongruen jika keduanya 'mendarat di posisi yang sama' setelah dibagi oleh modulus.",
  def:"a≡b (mod n) berarti n membagi a−b.",
  example:"17≡2 (mod 5) karena 17−2=15 habis dibagi 5.",
  pattern:"Jika a≡b (mod n), operasi penjumlahan, pengurangan, dan perkalian dapat dilakukan pada kedua ruas.",
  mistake:"Membagi kongruensi sembarangan. Pembagian memiliki syarat tambahan yang perlu diperhatikan.",
  osn:"Kongruensi menjadi alat utama untuk pola pangkat, sisa pembagian, dan beberapa pembuktian.",
  quiz:{q:"Apakah 25≡4 (mod 7) benar?",opts:["Benar","Salah"],ans:0,exp:"25−4=21 dan 21 habis dibagi 7."}},
 {id:"diophantine",topic:"numberTheory",title:"Persamaan Diophantine",order:9,
  learn:"Gunakan divisibility dan FPB untuk menyelesaikan persamaan yang solusinya harus bilangan bulat.",
  intuition:"Kamu tidak mencari sembarang titik pada garis, tetapi hanya titik yang koordinatnya bilangan bulat.",
  def:"Persamaan seperti ax+by=c disebut linear Diophantine jika x dan y dicari dalam bilangan bulat.",
  example:"3x+5y=1 memiliki solusi bulat karena FPB(3,5)=1 membagi 1.",
  pattern:"ax+by=c mempunyai solusi bulat jika dan hanya jika FPB(a,b) membagi c.",
  mistake:"Langsung mencari x,y tanpa mengecek syarat FPB terlebih dahulu.",
  osn:"Soal Diophantine sering ditambah syarat x,y positif atau berada pada interval tertentu.",
  quiz:{q:"2x+4y=7 punya solusi bulat?",opts:["Ya","Tidak, karena FPB(2,4)=2 tidak membagi 7"],ans:1,exp:"FPB(2,4)=2, tetapi 2 tidak membagi 7. Jadi tidak ada solusi bulat."}},

 {id:"al-persamaan",topic:"algebra",title:"Persamaan & Manipulasi Aljabar",order:1,
  learn:"Bangun kemampuan mengubah bentuk persamaan tanpa mengubah nilai yang dicari.",
  intuition:"Persamaan seperti timbangan: apa pun yang kamu lakukan pada satu sisi harus tetap dilakukan pada sisi lainnya.",

  mistake:"Melakukan operasi pada satu ruas saja.",
  osn:"Manipulasi aljabar adalah alat dasar sebelum masuk ke identitas, polinomial, dan inequality.",
  quiz:{q:"Jika 3x−4=11, nilai x adalah?",opts:["3","4","5","6"],ans:2,exp:"Tambah 4: 3x=15, lalu bagi 3: x=5."}},
 {id:"al-faktorisasi",topic:"algebra",title:"Faktorisasi Aljabar",order:2,
  learn:"Belajar melihat bentuk aljabar sebagai hasil perkalian beberapa faktor.",
  intuition:"Seperti 12=3·4, bentuk x²−9 juga bisa dipecah menjadi faktor: (x−3)(x+3).",

  pattern:"Kenali selisih kuadrat, kuadrat sempurna, dan faktor persekutuan.",
  mistake:"Salah tanda ketika mengembangkan kembali hasil faktorisasi.",
  osn:"Faktorisasi sering menyederhanakan persamaan dan membuka struktur tersembunyi.",
  quiz:{q:"Faktorisasi x²−16 adalah?",opts:["(x−4)(x+4)","(x−8)(x+2)","(x−4)²","(x+4)²"],ans:0,exp:"Ini bentuk selisih kuadrat: x²−4²=(x−4)(x+4)."}},
 {id:"al-inequality",topic:"algebra",title:"Inequality",order:3,
  learn:"Pahami cara membandingkan nilai dan kapan tanda pertidaksamaan berubah.",
  intuition:"Pertidaksamaan tidak mencari satu titik saja; kita mencari wilayah nilai yang memenuhi kondisi.",

 {id:"al-sequence",topic:"algebra",title:"Barisan & Pola",order:4,
  learn:"Belajar menemukan aturan yang menghasilkan suku-suku suatu barisan.",

 {id:"al-polynomial",topic:"algebra",title:"Polinomial & Identitas",order:5,
  learn:"Kenali struktur polinomial dan identitas yang bisa digunakan untuk menyederhanakan perhitungan.",

 {id:"ge-sudut",topic:"geometry",title:"Sudut & Garis",order:1,

 {id:"ge-segitiga",topic:"geometry",title:"Segitiga",order:2,
  learn:"Kuasai struktur segitiga sebelum masuk ke Pythagoras, kesebangunan, dan pembuktian.",

 {id:"ge-lingkaran",topic:"geometry",title:"Lingkaran",order:3,

  score=n?Math.round(score/n):0;
  let status="IN_PROGRESS";
  if(!cq&&!probs.length)status="NOT_STARTED";
  else if(score>=80 && cq && cq.correct && probs.filter(p=>p.correct).length>=1) status="MASTERED";
  return {score,status};
}
function nodeStatus(concept,idx){
  const m=conceptMastery(concept.id);
  if(m.status!=="NOT_STARTED")return m.status==="MASTERED"?"MASTERED":"IN_PROGRESS";
  if(idx===0)return "AVAILABLE";
  const prevM=conceptMastery(CONCEPTS[idx-1].id);
  return prevM.status==="MASTERED"?"AVAILABLE":"AVAILABLE"; // lock is advisory only
}
function solvedCount(){return Object.values(U.problemAttempts).length;}
function accuracyOverall(){const a=Object.values(U.problemAttempts);if(!a.length)return null;return Math.round(100*a.filter(x=>x.correct).length/a.length);}
function conceptsMasteredCount(){return CONCEPTS.filter(c=>conceptMastery(c.id).status==="MASTERED").length;}
function errorStats(){const s={};U.errors.forEach(e=>{s[e.type]=(s[e.type]||0)+1});return s;}
function recommendations(){
  const recs=[];
  // Use the latest diagnostic first: it gives the most direct concept-level signal.
  const latest=U.diagnostic;
  if(latest?.perSubtopic){
    const weak=Object.values(latest.perSubtopic)
      .map(x=>({...x,score:Math.round(100*x.correct/x.total)}))
      .sort((a,b)=>a.score-b.score)[0];
    if(weak && weak.score<80){
      recs.push({
        topic:weak.topic,
        subtopic:weak.subtopic,
        reason:`Fokus berikutnya: ${weak.subtopic} (${TOPIC_LABEL[weak.topic]}). Hasil diagnostic kamu ${weak.score}% pada subtopik ini.`,
        action:"concept"
      });
    }
  }
  for(const t of TOPICS){
    const acc=topicAccuracy(t);
    if(acc!==null && acc<70 && !recs.some(r=>r.topic===t)){
      recs.push({topic:t,reason:`Akurasi ${TOPIC_LABEL[t]} kamu ${acc}%, perlu diperkuat.`,action:"practice"});
    }
  }
  const es=errorStats(); const top=Object.entries(es).sort((a,b)=>b[1]-a[1])[0];
  if(top && top[1]>=2) recs.push({topic:null,reason:`${Math.round(100*top[1]/U.errors.length)}% kesalahanmu adalah ${top[0]}. Coba pelajari strategi terkait sebelum naik level.`,action:"strategy"});
  if(!recs.length) recs.push({topic:null,reason:"Belum cukup data untuk menentukan fokus. Mulai dengan Diagnostic Test atau kerjakan Problem Lab.",action:"diagnostic"});
  return recs.slice(0,3);
}

let diagState=null;

function buildDiagnostic(){
  const used=(U.diagnosticHistory||[]).flatMap(x=>x.ids||[]);
  const selected=[];
  TOPICS.forEach(topic=>{
    const pool=DIAG_Q.filter(q=>q.topic===topic);
    // Prefer unseen questions, then allow old questions only after exhausting unseen ones.
    let fresh=pool.filter(q=>!used.includes(q.id));
    if(fresh.length<5) fresh=[...fresh,...pool.filter(q=>used.includes(q.id))];
    fresh.sort(()=>Math.random()-0.5);
    // 2 basic/intermediate + 2 medium + 1 harder question
    const byDiff=d=>fresh.filter(q=>q.diff===d);
    const chosen=[];
    [1,2,2,3,3].forEach(d=>{
      const candidates=byDiff(d).filter(q=>!chosen.includes(q));
      if(candidates.length) chosen.push(candidates[Math.floor(Math.random()*candidates.length)]);
    });
    for(const q of fresh) if(chosen.length<5&&!chosen.includes(q)) chosen.push(q);
    selected.push(...chosen.slice(0,5));
  });
  return selected.sort(()=>Math.random()-0.5);
}

function diagResult(){
  const perTopic={}, perSubtopic={};
  TOPICS.forEach(t=>{
    const rs=diagState.answers.filter(a=>a.topic===t);
    perTopic[t]=rs.length?Math.round(100*rs.filter(a=>a.correct).length/rs.length):null;
  });
  diagState.answers.forEach(a=>{
    const key=a.topic+"|"+a.subtopic;
    if(!perSubtopic[key])perSubtopic[key]={topic:a.topic,subtopic:a.subtopic,total:0,correct:0};
    perSubtopic[key].total++;
    if(a.correct)perSubtopic[key].correct++;
  });
  const weak=Object.values(perSubtopic)
    .map(x=>({...x,score:Math.round(100*x.correct/x.total)}))
    .sort((a,b)=>a.score-b.score);
  const ids=diagState.questions.map(q=>q.id);
  U.diagnostic={date:new Date().toISOString(),perTopic,perSubtopic};
  U.diagnosticHistory=U.diagnosticHistory||[];
  U.diagnosticHistory.push({date:U.diagnostic.date,ids,perTopic});
  // Keep history useful without allowing it to grow forever.
  if(U.diagnosticHistory.length>10)U.diagnosticHistory.shift();
  save();

  const focus=weak.slice(0,4);
  return `

  html+=`</div>`;
  if(st.answered===null && !attempt){
    html+=`<div class="card"><div class="sec-label">Hint</div>
    ${p.hints.slice(0,st.hints).map((h,i)=>`<p>Hint ${i+1}: ${h}</p>`).join("")}
    ${st.hints<p.hints.length?`<button class="btn ghost sm" onclick="useHint('${id}')">Buka Hint ${st.hints+1}</button>`:'<p class="muted">Semua hint sudah dibuka.</p>'}</div>`;
  } else {
    const ss=strategiesForProblem(p);
    html+=`<div class="card"><div class="sec-label">Full Solution</div><p style="white-space:pre-wrap">${p.exp}</p></div>`;
    if(ss.length) html+=`<div class="card"><div class="sec-label">Strategi terkait</div>
      <p class="muted">Setelah melihat solusi, cek strategi yang bisa kamu bawa ke soal lain.</p>
      ${ss.map(s=>`<button class="btn ghost sm" style="margin:3px" onclick="nav('strategy','${s.id}')">${s.title}</button>`).join("")}
    </div>`;
  }
  return html;
}
window.useHint=function(id){probState[id].hints++;render();};
window.answerProblem=function(id,i){
  const p=PROBLEMS.find(x=>x.id===id);
  const correct=i===p.ans;
  const st=probState[id]||{hints:0};
  const record={topic:p.topic,subtopic:p.subtopic,diff:p.diff,correct,chosen:i,hintsUsed:st.hints||0,date:Date.now()};
  U.problemAttempts[id]=record;
  U.xp+=correct?(p.diff>=3?40:20):5;
  probState[id]={hints:st.hints||0,answered:record};
  if(!correct){
    showErrorPicker(id,p);
    return;
  }
  save(); render();
};
function showErrorPicker(id,p){
  document.getElementById("app").innerHTML=`
  <div class="card"><h3>Jawaban salah. Menurutmu, ini kesalahan apa?</h3>
  ${["Concept Error","Strategy Error","Calculation Error","Misread Problem","Careless Error"].map(t=>
    `<button class="opt" onclick="logError('${id}','${t}')">${t}</button>`).join("")}
  </div>`;
}
window.logError=function(id,type){
  const p=PROBLEMS.find(x=>x.id===id);
  U.errors.push({problemId:id,topic:p.topic,subtopic:p.subtopic,type,date:new Date().toISOString()});
  save(); nav('problem',id); render();
};

function viewProgress(){
  const lv=level(); const acc=accuracyOverall();
  return `
  <h2>Progress</h2>
  <div class="grid4">
    <div class="card"><div class="muted">Level</div><h3>${lv.i} — ${lv.name}</h3></div>
    <div class="card"><div class="muted">XP</div><h3>${U.xp}</h3></div>
    <div class="card"><div class="muted">Problems Solved</div><h3>${solvedCount()}</h3></div>
    <div class="card"><div class="muted">Accuracy</div><h3>${acc===null?'—':acc+'%'}</h3></div>
  </div>
  <div class="card"><div class="muted">Concepts Mastered</div><h3>${conceptsMasteredCount()} / ${CONCEPTS.length}</h3></div>
  <div class="card"><h3>Progress per Bidang</h3>
  ${TOPICS.map(t=>{const a=topicAccuracy(t);return `<div style="margin-bottom:10px"><div class="muted">${TOPIC_LABEL[t]} — ${a===null?'Belum ada data':a+'%'}</div>${bar(a||0)}</div>`;}).join("")}
  </div>
  <div class="card"><h3>Recommendation</h3>
  ${recommendations().map(r=>`<div class="next-action" style="padding:8px 0;border-bottom:1px solid var(--line)">
    <p style="margin:0">${r.reason}</p>
    ${r.action==="concept"&&r.subtopic?`<button class="btn sm ghost" onclick="nav('concept','${(CONCEPTS.find(c=>c.title===r.subtopic)||{}).id||''}')">Pelajari</button>`:
      r.action==="strategy"?`<button class="btn sm ghost" onclick="nav('strategy')">Strategi</button>`:
      `<button class="btn sm ghost" onclick="${r.topic?`nav('problem')`:`startDiagnostic()`}">${r.topic?'Latihan':'Mulai Diagnostic'}</button>`}
  </div>`).join("")}
  </div>`;
}

function viewErrors(){
  if(!U.errors.length) return `<div class="card"><h2>Error Log</h2><p class="muted">Belum ada kesalahan yang tercatat. Kerjakan beberapa problem untuk mulai membangun Error Log.</p></div>`;
  const stats=errorStats();
  return `
  <h2>Error Log</h2>
  <div class="card"><h3>Your Error Pattern</h3>
  ${Object.entries(stats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="muted">${k} — ${v}</div>${bar(100*v/U.errors.length,'var(--bad)')}`).join("")}
  </div>
  <div class="card"><table><tr><th>Problem</th><th>Topic</th><th>Subtopic</th><th>Error</th><th></th></tr>
  ${U.errors.slice().reverse().map(e=>`<tr><td>${e.problemId}</td><td>${TOPIC_LABEL[e.topic]}</td><td>${e.subtopic}</td><td>${e.type}</td>
  <td><button class="btn sm ghost" onclick="nav('problem','${e.problemId}')">Review</button></td></tr>`).join("")}
  </table></div>`;
}

/* ---------- RENDER ---------- */
function render(){
  renderNav();
  const {r,p}=currentRoute();
  const views={home:viewHome,diagnostic:viewDiagnostic,path:viewPath,
    concept:()=>viewConcept(p),problem:()=>viewProblem(p),strategy:()=>viewStrategy(p),
    progress:viewProgress,errors:viewErrors};
  document.getElementById("app").innerHTML=views[r]();
}
render();
</script>
</body>
</html>
